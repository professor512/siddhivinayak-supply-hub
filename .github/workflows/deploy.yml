name: SSH Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: SSH sanity test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            whoami
            pwd
            hostname
